<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Leave a Review — Balance — m kirk</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,700;1,400&family=Source+Serif+4:opsz,wght@8..60,300;8..60,400;8..60,700&family=Lora:ital,wght@0,400;0,700;1,400;1,700&family=Fraunces:ital,opsz,wght@0,9..144,300;1,9..144,300&family=Playfair+Display:ital,wght@0,400;0,700;0,900&family=GFS+Didot&family=Exo+2:ital,wght@0,300;0,700;0,800;0,900;1,300&family=Montserrat:wght@400;600;700;800&family=Poppins:ital,wght@0,300;0,700&family=Baloo+2:wght@700;800&family=Mulish:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="mkirk-style.css">
</head>
<body>
<section class="page" id="page-balance-review">
  <div class="page-tag">PAGE: <b>review-balance.html</b> — REAL content &amp; design, uploaded by Matt.</div>
  <style>

.real-balance-review {
  --bg: #f7f1e8;
  --ink: #2a2420;
  --ink-soft: #6b5e54;
  --gold: #BC942F;
  --gold-hover: #A37E25;
  --oxblood: #5C1928;            /* aligned with mkirkwrites Balance palette */
  --oxblood-hover: #7A2E40;
  --rule: #d9cebe;
  --banner-bg: #0E1216;          /* m kirk site chrome — same as nav/footer */
  --banner-gold: #C9A85C;        /* m kirk chrome gold */
  --display: 'Cormorant Garamond', Georgia, serif;
  --body: 'Lora', Georgia, serif;
  --chrome: 'Source Serif 4', Georgia, serif;
}

.real-balance-review * { box-sizing: border-box; margin: 0; padding: 0; }


.real-balance-review {
  background: var(--bg);
  color: var(--ink);
  font-family: var(--body);
  font-size: 17px;
  line-height: 1.6;
  min-height: 100vh;
  display: grid;
  grid-template-rows: auto 1fr auto;
}

/* ── BANNERS — m kirk chrome bookends ── */
.real-balance-review .site-banner {
  background: var(--banner-bg);
  display: flex;
  align-items: center;
  justify-content: center;
}

.real-balance-review .site-banner--top {
  border-bottom: 1px solid rgba(220,220,230,0.25);
  padding: 12px 40px;
  justify-content: stretch;
}
.real-balance-review .site-banner--top-inner {
  max-width: 1200px;
  width: 100%;
  margin: 0 auto;
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 24px;
}

.real-balance-review .site-banner--bottom {
  border-top: 1px solid rgba(91,166,124,0.12);
  flex-direction: column;
  gap: 6px;
  padding: 22px 24px;
}

.real-balance-review .banner-mark {
  font-family: var(--display);
  font-style: italic;
  font-weight: 400;
  font-size: 48px;
  letter-spacing: 0.04em;
  word-spacing: -0.1em;
  color: var(--banner-gold);
  text-decoration: none;
  line-height: 1;
  transition: opacity 0.2s;
}
.real-balance-review .banner-mark:hover { opacity: 0.82; }

.real-balance-review .banner-nav {
  display: flex;
  gap: 28px;
  align-items: center;
}
.real-balance-review .banner-nav a {
  font-family: var(--chrome);
  font-size: 18px;
  letter-spacing: 0.04em;
  color: #B85638;
  text-decoration: none;
  transition: color 0.2s;
}
.real-balance-review .banner-nav a:hover { color: #D4704A; }

.real-balance-review .banner-copy {
  font-family: var(--chrome);
  font-size: 13px;
  letter-spacing: 0.04em;
  color: #B85638;
}
.real-balance-review .banner-copy a {
  color: #B85638;
  text-decoration: none;
  transition: color 0.2s;
}
.real-balance-review .banner-copy a:hover { color: #D4704A; }

@media (max-width: 600px) {
.real-balance-review .site-banner--top { padding: 12px 24px; }
.real-balance-review .banner-nav { display: none; }
.real-balance-review .banner-mark { font-size: 40px; }
}

/* ── MAIN ── */
.real-balance-review main {
  align-self: center;
  justify-self: center;
  max-width: 480px;
  width: 100%;
  text-align: center;
  padding: 3rem 1.25rem;
}

.real-balance-review .mark {
  font-family: var(--display);
  font-style: italic;
  font-size: 0.95rem;
  letter-spacing: 0.22em;
  text-transform: uppercase;
  color: var(--ink-soft);
  margin-bottom: 2.25rem;
}

.real-balance-review .rule {
  width: 36px;
  height: 1px;
  background: var(--rule);
  margin: 0 auto 2.25rem;
}

.real-balance-review h1 {
  font-family: var(--display);
  font-weight: 500;
  font-size: clamp(2.1rem, 7vw, 2.9rem);
  line-height: 1.15;
  margin-bottom: 1.25rem;
  letter-spacing: -0.01em;
}

.real-balance-review h1 .balance-word {
  font-style: italic;
  font-weight: 700;
  color: var(--oxblood);
}

.real-balance-review .lede {
  font-size: 1.02rem;
  color: var(--ink-soft);
  margin: 0 auto 2.5rem;
  max-width: 36ch;
}

.real-balance-review .actions {
  display: flex;
  flex-direction: column;
  gap: 0.75rem;
}

.real-balance-review .btn {
  display: block;
  padding: 1.05rem 1.5rem;
  text-decoration: none;
  font-family: var(--body);
  font-weight: 500;
  font-size: 0.98rem;
  letter-spacing: 0.04em;
  border-radius: 2px;
  transition: background 0.2s ease, transform 0.2s ease;
}

.real-balance-review .btn:hover, .real-balance-review .btn:focus-visible {
  transform: translateY(-1px);
  outline: none;
}

.real-balance-review .btn--amazon {
  background: var(--gold);
  color: var(--oxblood);
}
.real-balance-review .btn--amazon:hover, .real-balance-review .btn--amazon:focus-visible {
  background: var(--gold-hover);
}

.real-balance-review .btn--goodreads {
  background: var(--oxblood);
  color: var(--bg);
}
.real-balance-review .btn--goodreads:hover, .real-balance-review .btn--goodreads:focus-visible {
  background: var(--oxblood-hover);
}

@keyframes rise__real-balance-review {
  from { opacity: 0; transform: translateY(10px); }
  to   { opacity: 1; transform: translateY(0); }
}

.real-balance-review main > * {
  animation: rise__real-balance-review 0.6s ease-out backwards;
}
.real-balance-review .mark { animation-delay: 0.05s; }
.real-balance-review .rule { animation-delay: 0.15s; }
.real-balance-review h1 { animation-delay: 0.25s; }
.real-balance-review .lede { animation-delay: 0.35s; }
.real-balance-review .actions { animation-delay: 0.45s; }

@media (prefers-reduced-motion: reduce) {
.real-balance-review main > * { animation: none; }
.real-balance-review .btn:hover, .real-balance-review .btn:focus-visible { transform: none; }
}

  </style>
  <div class="real-balance-review">


<header class="site-banner site-banner--top">

<main>

  <p class="lede">If it stayed with you, leave a few honest words. It's how the next reader finds it.</p>
  <div class="actions">
    <a class="btn btn--amazon" href="https://www.amazon.com/dp/B0GS7C4GKZ#customerReviews" target="_blank" rel="noopener">Review on Amazon</a>

  </div>
</main>

<footer class="site-banner site-banner--bottom">
  <a href="#page-home" class="banner-mark" aria-label="m kirk — home">m kirk</a>
  <p class="banner-copy">© m kirk · <a href="#page-home">mkirkwrites.com</a></p>
</footer>


  </div>
</section>
<script>
// Subtle scroll-reveal, respects prefers-reduced-motion via CSS above.
if ('IntersectionObserver' in window) {
  const io = new IntersectionObserver((entries) => {
    entries.forEach(e => { if (e.isIntersecting) { e.target.classList.add('is-visible'); io.unobserve(e.target); } });
  }, { threshold: 0.15 });
  document.querySelectorAll('.reveal').forEach(el => io.observe(el));
} else {
  document.querySelectorAll('.reveal').forEach(el => el.classList.add('is-visible'));
}
</script>
</body>
</html>
